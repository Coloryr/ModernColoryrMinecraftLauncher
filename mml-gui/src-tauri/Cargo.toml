[package]
name = "mml-gui"
version = "0.1.0"
description = "M²L Launcher"
authors = ["coloryr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mml_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.1", features = [] }
gui-ipc-gen = { path = "../ipc-gen" }

[dependencies]
tauri = { version = "~2.12.2", features = [] }
base64.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-decoration = { path = "../../target/vendor/tauri-plugin-decoration" }
async-trait.workspace = true
gui-macros = { path = "../macros" }
serde.workspace = true
serde_json.workspace = true
font-kit.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
tiny-skia.workspace = true
image.workspace = true
rfd.workspace = true
tokio.workspace = true
tokio-util.workspace = true

mml-core = { path = "../../mml-core" }
mml-game = { path = "../../mml-core/mml-game" }
mml-config = { path = "../../mml-core/mml-config" }
mml-jvms = { path = "../../mml-core/mml-jvms" }
mml-downloader = { path = "../../mml-core/mml-downloader" }
mml-sys = { path = "../../mml-core/mml-sys" }
mml-net = { path = "../../mml-core/mml-net" }
mml-log = { path = "../../mml-core/mml-log" }
mml-base = { path = "../../mml-core/mml-base" }
mml-auth = { path = "../../mml-core/mml-auth" }
mml-names = { path = "../../mml-core/mml-names" }
mml-skin = { path = "../../mml-core/mml-skin" }
mml-skin-draw = { path = "../../mml-core/mml-skin-draw" }
mml-tex-draw = { path = "../../mml-core/mml-tex-draw" }

[dev-dependencies]
# 测试临时目录统一放 target/temp（AGENTS.md §6）：不要用系统 %TEMP%，也不要自己拼仓库根
mml-testutil = { path = "../../mml-core/mml-testutil" }
