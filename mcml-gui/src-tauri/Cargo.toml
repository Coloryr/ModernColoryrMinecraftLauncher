[package]
name = "mcml-gui"
version = "0.1.0"
description = "MCML Launcher"
authors = ["coloryr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcml_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-opener = "~2.5.4"
tauri-plugin-dialog = "~2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

mcml-core = { path = "../../mcml-core" }
mcml-config = { path = "../../mcml-core/mcml-config" }
mcml-sys = { path = "../../mcml-core/mcml-sys" }
mcml-base = { path = "../../mcml-core/mcml-base" }
mcml-auth = { path = "../../mcml-core/mcml-auth" }
mcml-names = { path = "../../mcml-core/mcml-names" }

uuid = { version = "~1.24.0", features = ["v4", "serde"] }
dirs = "~6.0.0"
rfd = "~0.16"
tokio-util = "~0.7.19"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
