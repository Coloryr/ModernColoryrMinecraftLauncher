[package]
name = "mcml-gui"
version = "0.1.0"
description = "MCML Launcher"
authors = ["coloryr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcml_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }
gui-ipc-gen = { path = "../ipc-gen" }

[dependencies]
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-dialog = "~2.7.2"
async-trait = "~0.1.92"
gui-macros = { path = "../macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

mcml-core = { path = "../../mcml-core" }
mcml-game = { path = "../../mcml-core/mcml-game" }
mcml-config = { path = "../../mcml-core/mcml-config" }
mcml-jvms = { path = "../../mcml-core/mcml-jvms" }
mcml-downloader = { path = "../../mcml-core/mcml-downloader" }
mcml-sys = { path = "../../mcml-core/mcml-sys" }
mcml-net = { path = "../../mcml-core/mcml-net" }
mcml-log = { path = "../../mcml-core/mcml-log" }
mcml-base = { path = "../../mcml-core/mcml-base" }
mcml-auth = { path = "../../mcml-core/mcml-auth" }
mcml-names = { path = "../../mcml-core/mcml-names" }
mcml-skin = { path = "../../mcml-core/mcml-skin" }
mcml-skin-draw = { path = "../../mcml-core/mcml-skin-draw" }

uuid = { version = "~1.26.0", features = ["v4", "serde"] }
dirs = "~6.0.0"
tiny-skia = "~0.11.4"
image = { version = "~0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "~0.16"
tokio = "~1.53.1"
tokio-util = "~0.7.19"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# 正式发布：fat LTO + 单代码生成单元，体积最小、运行最快，但出包慢（单线程合并优化）
# 命令：cargo build --release / npm run build:release
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 预发布：thin LTO + 并行代码生成，出包快很多，性能与此前基本一致（体积略大）
# 命令：cargo build --profile prerelease / npm run build:pre
# 注意：自定义 profile 有自己的 target 子目录（target/prerelease），首次构建要重编全部依赖
[profile.prerelease]
inherits = "release"
codegen-units = 16
lto = "thin"
