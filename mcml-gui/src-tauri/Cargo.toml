[package]
name = "mcml-gui"
version = "0.1.0"
description = "MCML Launcher"
authors = ["coloryr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcml_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"

# ---- mcml-core（启动器核心）----
# 当前阶段：gui 与 core 解耦，不链接核心，只做界面（前端使用模拟数据）。
# 后续接入核心时建议走独立进程 IPC；如需直接链接，取消下面注释：
# mcml-game = { path = "../../mcml-core/mcml-game" }
# mcml-auth = { path = "../../mcml-core/mcml-auth" }
# mcml-base = { path = "../../mcml-core/mcml-base" }
# mcml-config = { path = "../../mcml-core/mcml-config" }
# mcml-downloader = { path = "../../mcml-core/mcml-downloader" }
# mcml-jvms = { path = "../../mcml-core/mcml-jvms" }
# mcml-log = { path = "../../mcml-core/mcml-log" }
# mcml-net = { path = "../../mcml-core/mcml-net" }



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
