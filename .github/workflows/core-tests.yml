name: core-tests

# mcml-core 全部 crate 的跨平台测试（Windows / Linux / macOS）
on:
  push:
    paths:
      - "mcml-core/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "mcml-core/**"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcml-core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcml-core

      # Linux 编译依赖：dbus（mcml-ipc）、clang/cmake（skia-safe）、OpenGL/X11（glow/渲染）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev pkg-config \
            clang cmake \
            libgl1-mesa-dev libx11-dev \
            libfontconfig1-dev \
            libssl-dev

      # 需要真实网络/凭据的测试标了 #[ignore]，默认不跑
      - name: Run tests
        run: cargo test --workspace
