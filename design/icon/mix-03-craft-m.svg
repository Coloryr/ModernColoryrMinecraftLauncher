<!--
  M²L 程序图标 · 融合向 M3「合成台里的 M」

  思路：Minecraft 里最有"操作感"的界面就是**合成台的格子**。
  这里把 5×5 个槽位摆出来，其中若干格填成亮色，正好拼出字母 M ——
  "在合成台里合出一个 M"：方块格子（Minecraft 的视觉语言）+ M（名字），
  而且格子本身就是方形的，不用另外画方块。

  规格：
  - 底 24/24/464/464、rx=108；**木色渐变** #a9743f → #7a4c26（合成台台面）+ 顶部高光
  - 槽位：5×5，格 62、缝 8（pitch 70），整体 342×342，左上角 (85,85)，居中
      空槽 #6b4022（凹槽），M 格 #e6c48a（浅木），全部 rx=10
  - 点亮的 13 格（5×5 的 M）：
      row0: ■ . . . ■
      row1: ■ ■ . ■ ■
      row2: ■ . ■ . ■
      row3: ■ . . . ■
      row4: ■ . . . ■

  取舍：木色底与品牌蓝紫完全不同路子 —— 这是**刻意的**：这一版走"Minecraft 本体"的质感，
  跟另外几个品牌色版本放在一起时，一眼能分出"这组是 MC 味的"。
  16px 下 25 个槽位会并成一块，M 仍然是亮的那个形状。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9743f" />
      <stop offset="1" stop-color="#7a4c26" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

  <!-- 空槽（12 个） -->
  <g fill="#6b4022">
    <rect x="155" y="85" width="62" height="62" rx="10" />
    <rect x="225" y="85" width="62" height="62" rx="10" />
    <rect x="295" y="85" width="62" height="62" rx="10" />

    <rect x="225" y="155" width="62" height="62" rx="10" />

    <rect x="155" y="225" width="62" height="62" rx="10" />
    <rect x="295" y="225" width="62" height="62" rx="10" />

    <rect x="155" y="295" width="62" height="62" rx="10" />
    <rect x="225" y="295" width="62" height="62" rx="10" />
    <rect x="295" y="295" width="62" height="62" rx="10" />

    <rect x="155" y="365" width="62" height="62" rx="10" />
    <rect x="225" y="365" width="62" height="62" rx="10" />
    <rect x="295" y="365" width="62" height="62" rx="10" />
  </g>

  <!-- M 格（13 个） -->
  <g fill="#e6c48a">
    <rect x="85" y="85" width="62" height="62" rx="10" />
    <rect x="365" y="85" width="62" height="62" rx="10" />

    <rect x="85" y="155" width="62" height="62" rx="10" />
    <rect x="155" y="155" width="62" height="62" rx="10" />
    <rect x="295" y="155" width="62" height="62" rx="10" />
    <rect x="365" y="155" width="62" height="62" rx="10" />

    <rect x="85" y="225" width="62" height="62" rx="10" />
    <rect x="225" y="225" width="62" height="62" rx="10" />
    <rect x="365" y="225" width="62" height="62" rx="10" />

    <rect x="85" y="295" width="62" height="62" rx="10" />
    <rect x="365" y="295" width="62" height="62" rx="10" />

    <rect x="85" y="365" width="62" height="62" rx="10" />
    <rect x="365" y="365" width="62" height="62" rx="10" />
  </g>
</svg>
