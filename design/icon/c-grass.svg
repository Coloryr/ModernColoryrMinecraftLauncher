<!--
  M²L 程序图标 · 方案 C「草方块」（真实等距 + 渐变 + 淡颗粒）

  思路：不画字母，直接用 Minecraft 最有辨识度的那个图形 —— 草方块。

  规格：
  - 画布 512×512，无底色（透明）
  - **真实等距投影（30°）**：顶面菱形 宽:高 = √3:1，总高:总宽 = 2/√3 ≈ 1.155
      顶点 T(256,46) 右 R(438,151) 中 C(256,256) 左 L(74,151)
      右下 BR(438,361) 底 B(256,466) 左下 BL(74,361)
  - **三个面各一条竖向渐变**（顶面最亮、右面最暗），不用实色铺满 ——
    实色多档在 512px 下会变成噪点棋盘
  - **草皮**：每个侧面一条实心多边形，上沿贴着面的上沿、底缘是每列下探 4~6 格的像素台阶。
    台阶按"该面的两条基向量 + 逐列深度"算：
      q(u,v) = O + (u·U + v·V) / 16      u,v 是纹理格（0~16）
    左右两面必须**各用自己的基向量**（左面 U = C-L，右面 U = C-R，方向相反）。
    曾经右面那块把点算到了左面的区域（反解回纹理坐标 u 会到 20，且点序错乱），
    表现就是草皮沿右面"往下淌"；判断办法是把多边形顶点反解回 (u,v)，
    合法范围就是 u∈[0,16]、v∈[0,草皮厚度]。
  - **颗粒**：16×16 网格里约 30% 的格子铺白 7% / 黑 5%，同类合并成一条 path
    （相邻小方块各自抗锯齿会在缩放时咬出细线，不能一格一个 <rect>）

  改草皮厚度：改那条多边形的逐列深度（0~16 格），两面各一份。
-->
