<!--
  M²L 程序图标 · 名字向 N4「切割板 M」

  思路：把 M 做成**镂空**的 —— 品牌渐变底上放一块白色圆角板，M 从板里被"切掉"，
  露出底下的渐变。负空间的做法让画面只有两个元素、边界极清楚，
  也是应用图标里很常见的一种"高级感"处理。

  规格：
  - 底 24/24/464/464、rx=108；品牌渐变 #4f8cff → #7c5cff + 顶部高光
  - 白板：x/y 120、272×272、rx=64（居中）
  - 镂空 M：`M189 308 V203 L256 275 L323 203 V308`，笔宽 46、端点 butt、折角 round
      字形占 x 166~346、y 203~308，板内四边各留 46px
  - 实现用 `<mask>`：蒙版 = 白板（白）+ M（黑），再把同一块白板按蒙版画一遍 ——
    M 处自然透出底下的渐变，不用手工算挖洞路径

  取舍：镂空处的渐变是"底色"，M 与底的对比取决于底本身，比白字方案稍弱；
  换来的是整个图标只有"板 + M"两个形，缩到 32px 仍然干净。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="plate-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="120" y="120" width="272" height="272" rx="64" fill="#ffffff" />
      <path d="M189 308V203L256 275L323 203V308"
            fill="none" stroke="#000000" stroke-width="46" stroke-linecap="butt" stroke-linejoin="round" />
    </mask>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

  <rect x="120" y="120" width="272" height="272" rx="64" fill="#ffffff" mask="url(#plate-mask)" />
</svg>
