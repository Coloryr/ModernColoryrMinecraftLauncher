<!--
  M²L 程序图标 · 方案 I「品牌底 + 草方块」（B 的底 + C 的草方块）

  思路：B 的品牌渐变底最好认，C 的草方块最有 Minecraft 味 ——
  把 C 的草方块放进 B 的底里，替掉原来那个白方块。

  规格：
  - 画布 512×512；底与 B 同源（24/24/464/464，rx=108，品牌渐变 #4f8cff → #7c5cff）
  - 草方块绘制内容**原样来自 c-grass.svg**（三条 userSpaceOnUse 渐变 + 三个颗粒 pattern，
    含 200 多行坐标，脚本搬运、逐字节一致），仅把 id 加了 `grs-` 前缀，
    免得两份内联进同一个文档时 id 互相顶掉
  - 比例：C 的方块是**真等距（30°，高:宽 = 2/√3 ≈ 1.155）**，B 的方块是 2:1 压扁的（348×360）。
    两者不能同时对齐，这里**按宽度对齐**：缩放 348/364 = 0.9560440，
    缩放后正好落在 B 方块的水平 footprint 上（x 82~430 完全重合），
    纵向因为真等距更高（y 55.2~456.8，高 401.5），距圆角底边仍有 31px 留白。
      按"高度对齐"的替代档：scale = 360/420 = 0.8571429、translate(36.5714)，
      方块 312×360（与 B 方块上下齐平、略窄）。实测 16px 下主体明显偏小，
      所以没用它
  - 缩放挂在 `<g transform>` 上：渐变与 pattern 都是 userSpaceOnUse，
    会跟着祖先变换一起缩放，草皮颗粒的格子尺寸因此自动同步
  - **不带 B 的顶部高光**：那层白色高光（顶部 22% → 45% 处归零）会把草地上半部分的
    底色提亮，绿顶对蓝底的反差被吃掉一截；去掉后底是干净的斜向渐变，
    草方块边缘更利落（对照过带/不带高光的 512 与 16px 两种尺寸）。
      要恢复：在底 rect 后面照抄 b-cube.svg 里的 `url(#gloss)` 那条 rect 与它的渐变定义
  - C 原本那个 `translate(-11.38 16.41)` 没有沿用 —— 它来自早先版本里
    "草皮凸起顶出包围盒"的补偿，现在凸起都在面内，照搬会让方块偏左下

  ⚠ 这份是"搬一次"的静态产物：以后 C 改了草方块，这里不会自动跟着变，得重跑一次搬运。
-->
