<!--
  M²L 程序图标 · 名字向 N2「ML 连字」

  思路：名字的首尾字母 M（Modern / Minecraft）与 L（Launcher）**共用笔画**：
  M 的右竖笔到底后直接向右折出一横，那一横同时就是 L 的底横。
  一个字形同时读出 "M" 与 "L"，比硬排三个字母（MML）在小尺寸下结实得多。

  规格：
  - 底 24/24/464/464、rx=108；品牌渐变 #4f8cff → #7c5cff + 顶部高光
  - 字形：**一条连续描边路径** `M124 336 V148 L214 284 L304 148 V336 H388`
    笔宽 56、端点 butt、折角 round（折角处圆角，笔画交接处才不会咬出尖刺）
      左竖 x=124、右竖 x=304、中间 V 顶点 y=284、底横到 x=388
  - 包围盒：x 96~416、y 148~364，画布正中（中心 256,256）

  取舍：连字要"一眼看出是两个字母"需要一点观看经验；好处是字形有记忆点，
  而且 16px 下就是一个"带脚的 M"，比三个字母糊成一团强。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

  <path d="M124 336V148L214 284L304 148V336H388"
        fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="butt" stroke-linejoin="round" />
</svg>
