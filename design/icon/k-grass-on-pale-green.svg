<!--
  M²L 程序图标 · 方案 K「淡绿底 + 草方块（带内描边）」

  淡色路线里与草同色系的一版：底与草皮同调，整体最柔和。代价是方块与底色的分界最弱，所以配了内描边。

  规格：
  - 画布 512×512；底 24/24/464/464、rx=108：淡绿渐变 #eef8e8 → #d3ebc6
  - 底上叠一层顶部高光（url(#gloss)，白色 22% → 45% 处归零），与 B 的底同一套处理；
    草方块画在它之后，所以高光只作用在底上，不会给草方块本身着色
  - 内描边（hairline）：底边缘压一条 stroke="#0b1220"、opacity 0.12、width 2 的内描边。
    淡色底在浅色背景（白页 / Windows 浅色任务栏 #f3f3f3）上，圆角方块的边界会消失，
    这道描边把边界找回来；深色背景下它几乎不可见，不干扰画面
  - 草方块绘制内容**原样来自 c-grass.svg**（三条 userSpaceOnUse 渐变 + 三个颗粒 pattern，
    含 200 多行坐标，脚本搬运、逐字节一致），仅把 id 加了 grs- 前缀，
    免得两份内联进同一个文档时 id 互相顶掉
  - 比例：C 的方块是真等距（30°，高:宽 = 2/√3 ≈ 1.155），B 的方块是 2:1 压扁的（348×360），
    两者不能同时对齐。这里**按宽度对齐**：缩放 348/364 = 0.9560440，
    缩放后正好落在 B 方块的水平 footprint 上（x 82~430 完全重合），
    纵向因真等距更高（y 55.2~456.8），距圆角底边仍有 31px 留白
  - 缩放挂在 <g transform> 上：渐变与 pattern 都是 userSpaceOnUse，会跟着祖先变换一起缩放，
    草皮颗粒的格子尺寸因此自动同步
  - C 原本那个 translate(-11.38 16.41) 没有沿用 —— 它来自早先版本里"草皮凸起顶出包围盒"的补偿，
    现在凸起都在面内，照搬会让方块偏左下

  已知取舍：底与草皮同色系，方块的上半（草）与底的分界本就偏弱，
  是三个淡色候选里最需要那道内描边的一个。

  ⚠ 这是"搬一次"的静态产物：以后 C 改了草方块，这里不会自动跟着变，得重跑 gen-grass-icons.ps1。
-->
