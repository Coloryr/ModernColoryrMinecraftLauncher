<!--
  M²L 程序图标 · 融合向 M4「播放三角 + 镂空 M」

  思路：把"启动器"这件事最直白的符号拿来 —— **播放三角**；
  Minecraft 的视觉语言用**像素方块**（三角的边是硬的、M 是格子拼的）；
  名字用 M 直接刻在三角里（镂空，露出底色）。

  规格：
  - 底 24/24/464/464、rx=108；品牌渐变 #4f8cff → #7c5cff + 顶部高光
  - 三角：**硬边**（不用圆角，像素风），(116,88) (116,424) (408,256)
      整体相对画布中心右移 6px —— 播放三角的视觉重心偏左，居中反而看着偏左
  - 镂空 M：4 行 5 列的格子，格 22、缝 5（pitch 27），左上角 (160,204)
      row0: ■ . . . ■
      row1: ■ ■ . ■ ■
      row2: ■ . ■ . ■
      row3: ■ . . . ■
      字形框 130×103，距三角斜边上下各留 ≥16px（斜边近右端会收窄，留够才不会切到）
  - 实现：`<mask>` = 白色三角 + 黑色 M 格，再把一整块白 rect 按蒙版画一遍；
    镂空处透出底下的品牌渐变

  取舍：三角内部空间是收窄的，M 只能做到三角宽度的约 45%，255 也不会更大；
  换来的是"启动 + 方块 + 名字"三件事在一张图里说完。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="play-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <polygon points="116,88 116,424 408,256" fill="#ffffff" />
      <g fill="#000000">
        <rect x="160" y="204" width="22" height="22" />
        <rect x="268" y="204" width="22" height="22" />

        <rect x="160" y="231" width="22" height="22" />
        <rect x="187" y="231" width="22" height="22" />
        <rect x="241" y="231" width="22" height="22" />
        <rect x="268" y="231" width="22" height="22" />

        <rect x="160" y="258" width="22" height="22" />
        <rect x="214" y="258" width="22" height="22" />
        <rect x="268" y="258" width="22" height="22" />

        <rect x="160" y="285" width="22" height="22" />
        <rect x="268" y="285" width="22" height="22" />
      </g>
    </mask>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

  <rect x="0" y="0" width="512" height="512" fill="#ffffff" mask="url(#play-mask)" />
</svg>
