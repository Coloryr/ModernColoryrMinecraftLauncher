<!--
  M²L 程序图标 · 名字向 N3「单字 M（硬折角）」

  思路：最省事的名字向做法 —— 只放一个 M，做到最大、最硬。
  与 N1 的区别是**去掉了 ²、换 miter 尖角**：笔画更粗、折角是尖的，
  读起来更像"工程/工具"，而不是"N1 那种圆润的字标"。

  规格：
  - 底 24/24/464/464、rx=108；**近黑中性渐变** #1f232b → #14161a（不带高光，
    深底上的白高光会变成一层灰雾），终色取应用暗色底 --bg #14161a
  - 字形：`M128 348 V164 L256 300 L384 164 V348`，笔宽 64、端点 butt、折角 **miter**
  - 包围盒：x 96~416、y 164~348；（尖角 miter 的尖端落在 y≈347，仍在本行内，
    不会捅出字形框）

  为什么这个方案换成深底：白 M + 近黑底是这个尺寸下对比度最高的一组，
  16px 下就是一"白 M"，不会像品牌渐变底那样与白色笔画抢注意力。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f232b" />
      <stop offset="1" stop-color="#14161a" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />

  <path d="M128 348V164L256 300L384 164V348"
        fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="butt" stroke-linejoin="miter" />
</svg>
