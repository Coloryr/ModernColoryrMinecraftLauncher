    <polygon points="372,206 372,236 336,254 336,224" fill="#dbe7ff" />
    <polygon points="300,206 336,224 336,254 300,236" fill="#b9d2ff" />
    <polygon points="416,188 452,206 416,224 380,206" fill="#ffffff" />
