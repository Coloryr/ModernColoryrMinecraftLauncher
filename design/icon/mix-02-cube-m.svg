<!--
  M²L 程序图标 · 融合向 M2「方块堆成的 M」

  思路：名字（M）和 Minecraft（方块）**用同一种东西表达** ——
  11 个等距小方块按 5×4 的格子摆成字母 M。没有一个额外元素，
  但"方块"和"M"两个信息一次说完，且是唯一一个"用方块本身当笔画"的方案。

  规格：
  - 底 24/24/464/464、rx=108；品牌渐变 #4f8cff → #7c5cff + 顶部高光
  - 每个方块：半宽 s=36、等距 dy=18、棱高 h=30（2:1 等距）
      顶面 #ffffff / 右面 #dbe7ff / 左面 #b9d2ff（三档明度差拉够，小尺寸才分得开）
  - 方块顶点位置：x = 96 + 列×80，y = 118 + 行×70（列距 80 > 宽 72、行距 70 > 高 66，
    方块之间留 4~8px 缝，读出来是"一个个方块"，不是一坨）
  - 摆成 5×4 的 M（11 格）：
      row0: ■ . . . ■
      row1: ■ ■ . ■ ■
      row2: ■ . ■ . ■
      row3: ■ . . . ■
    整体 x 60~452、y 118~394，画布正中

  取舍：11 个方块 = 33 个多边形，512px 下有"堆方块"的质感；
  16px 下缝隙消失、并入成一个 M，反而最干净 —— 这是这套里小尺寸最稳的一个。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

    <polygon points="96,118 132,136 96,154 60,136" fill="#ffffff" />
    <polygon points="132,136 132,166 96,184 96,154" fill="#dbe7ff" />
    <polygon points="60,136 96,154 96,184 60,166" fill="#b9d2ff" />
    <polygon points="416,118 452,136 416,154 380,136" fill="#ffffff" />
    <polygon points="452,136 452,166 416,184 416,154" fill="#dbe7ff" />
    <polygon points="380,136 416,154 416,184 380,166" fill="#b9d2ff" />
