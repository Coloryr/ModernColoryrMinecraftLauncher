    <polygon points="60,276 96,294 96,324 60,306" fill="#b9d2ff" />
    <polygon points="256,258 292,276 256,294 220,276" fill="#ffffff" />
    <polygon points="292,276 292,306 256,324 256,294" fill="#dbe7ff" />
    <polygon points="220,276 256,294 256,324 220,306" fill="#b9d2ff" />
    <polygon points="416,258 452,276 416,294 380,276" fill="#ffffff" />
    <polygon points="452,276 452,306 416,324 416,294" fill="#dbe7ff" />
    <polygon points="380,276 416,294 416,324 380,306" fill="#b9d2ff" />
    <polygon points="96,328 132,346 96,364 60,346" fill="#ffffff" />
