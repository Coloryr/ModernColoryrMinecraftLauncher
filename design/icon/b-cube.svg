<!--
  M²L 程序图标 · 方案 B「等距方块」

  思路：Minecraft 最直白的意象就是一个方块。用等距（2:1）立方体当主体，
  三面用不同不透明度的白，浮在品牌渐变上 —— 不画字母，32px 下反而最清楚。

  规格：
  - 画布 512×512，圆角方块与方案 A 完全一致（同一套底，换主体而已）
  - 立方体：宽 348、高 360，正居中；顶 / 右 / 左三面白 0.94 / 0.62 / 0.40
  - 等距比例 2:1（dx=174, dy=90），是 Minecraft 方块的标准投影
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

  <!-- 顶面 -->
  <polygon points="256,76 430,166 256,256 82,166" fill="#ffffff" fill-opacity="0.94" />
  <!-- 右面 -->
  <polygon points="430,166 430,346 256,436 256,256" fill="#ffffff" fill-opacity="0.62" />
  <!-- 左面 -->
  <polygon points="82,166 256,256 256,436 82,346" fill="#ffffff" fill-opacity="0.40" />
</svg>
