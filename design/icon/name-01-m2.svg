<!--
  M²L 程序图标 · 名字向 N1「M² 字标」

  思路：名字 ModernMinecraftLauncher 太长，图标里只能装它的"缩写形态"。
  取 M + 上标 2 —— 对应名字里 Minecraft 的 M 与 "M²L" 这个写法里的 ²，
  两个字符就能代表整个名字，而且是个纯粹的"软件标记"，跟一堆方块图标不撞脸。

  规格：
  - 底 24/24/464/464、rx=108；品牌渐变 #4f8cff → #7c5cff + 顶部高光（与前端默认主题色一致）
  - 字：纯白、**描边路径**（不写 <text>，不依赖字体，换环境渲染一致）
      M：竖笔中心线 x = 111.5 / 307.5，笔宽 56，顶 y=166、底 y=347，中间 V 顶点 y=296
         端点 butt（底边齐平）、折角 round（小尺寸不出尖刺）
      ²：x 366→420，顶 166、底 239，笔宽 16
         上沿**必须带弧**：方块式「上横 → 斜 → 下横」在拓扑上就是 Z，实测 64px 会被读成 "MZ"
  - 整组（M + 22px 间隙 + ²）水平居中：内容 83.5 ~ 428

  取舍：16px 下 ² 只剩 2~3px，会糊成一个小白点，M 本身仍清楚。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#gloss)" />

  <path d="M111.5 347V166L209.5 296L307.5 166V347"
        fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="butt" stroke-linejoin="round" />
  <path d="M366 192Q366 174 392 174Q420 174 420 194Q420 210 400 223L366 231H420"
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
