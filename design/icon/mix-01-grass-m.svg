<!--
  M²L 程序图标 · 融合向 M1「草方块 + 顶面 M」

  思路：最直接的一种"名字 + Minecraft"叠合 —— 草方块（MC 最有辨识度的物件）
  的**顶面刻一个 M**（名字）。M 是贴着顶面的**透视形**，不是平板贴上去的贴纸：
  它按顶面自己的两条基向量摆，所以看起来是"画在方块表面上"。

  规格：
  - 底 24/24/464/464、rx=108；品牌渐变 #4f8cff → #7c5cff + 顶部高光
  - 草方块绘制内容**原样来自 c-grass.svg**（脚本搬运、逐字节一致，id 加 grs- 前缀），
    按宽度对齐缩放到 348 宽（x 82~430，与另一个方案里的缩放完全同一套）
  - 顶面在 c 的坐标系里是 T(256,46) R(438,151) C(256,256) L(74,151)，
    两条基向量 u = R−T = (182,105)、v = L−T = (−182,105)。
    用 matrix(182 −182 105 105 256 46) 把 (a,b)∈[0,1]² 映射到顶面；
    M 画在 100×60 的方格里（笔宽 30），再缩到 (a,b) 的中央：
      translate(0.24 0.344) scale(0.0052)
    于是 M 占顶面 a 方向约 68%、b 方向约 47%，四边都不出顶面
  - M 是白色：(a,b) 空间里 u、v 等长，所以在面上不会被拉扁，透视看着是对的

  取舍：M 躺在顶面上，16px 下只剩一个小亮点 —— 这一版赢在"看着像真刻在方块上"，
  不赢在小尺寸。要小尺寸清楚，看 M2 / M4。
-->
